# .github/workflows/fetch.yml
name: Atualizar Artigos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          pwd
          ls -la

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar fetcher
        run: |
          python fetch_articles.py
        env:
          DB_URL: ${{ secrets.DB_URL }}

      - name: Verificar JSON gerado
        run: |
          ls -la data/
          cat data/artigos_ceara.json | head -c 200

      - name: Commit e Push (se houver mudanças)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/artigos_ceara.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi

          git commit -m "Atualiza artigos [skip ci]"
          git push origin HEAD
